# Local build and smoke test. Reads secrets from .env (already git-ignored).
# Run: docker compose up --build   then open http://localhost:8080
services:
  price-aggregator:
    build: .
    image: price-aggregator:1.0
    container_name: price-aggregator
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env
